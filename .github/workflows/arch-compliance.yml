name: Architecture compliance

# Three gates on every pull request (docs/architecture/ACF_ROADMAP.md, Phase 1):
#   - acf-check-diff --call-site ci: the mandates in config/architecture/mandates.yml
#     that declare the ci site, on the files the pull request changed;
#   - ruff on all of recipeparser/, and elsewhere (scripts/, tests/) on the lines the pull
#     request changed (scripts/ci/ruff_changed_lines.py);
#   - dependencies: requirements.txt is the lock of pyproject.toml, and every import in
#     recipeparser/ is declared there (deptry).
# The workflow does not run on a push to master: a pull request already checked it.
on:
  pull_request:

jobs:
  arch-compliance:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # The plugin version the local hooks run (arch-compliance 0.3.4), so CI and
      # the pre-push hook apply the same detectors.
      - uses: IanDBallard/arch-compliance-for-superpowers/.github/actions/check-diff@v0.3.4

  ruff:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # The version ruff resolves to locally (pyproject.toml allows >=0.4).
      - run: pip install "ruff==0.15.8"
      - run: ruff check recipeparser
      - run: python scripts/ci/ruff_changed_lines.py --base "origin/${{ github.base_ref }}"

  dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install "uv==0.11.32" "deptry==0.25.1"
      - run: python scripts/ci/lock_requirements.py --check
      - run: deptry recipeparser
