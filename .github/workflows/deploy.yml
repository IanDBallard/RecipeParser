name: Deploy

# Builds and, on a merge to master, pushes the ingestion API image and
# deploys it to the Cayenne VM. On a pull request (including one from a
# fork) this only builds the image -- no push, no ghcr login, no tailnet,
# no deploy -- so a broken Dockerfile fails here rather than during a
# deploy, and no secret is ever reachable from a fork's PR.
#
# deploy.sh already lives on the VM, installed there by the Cayenne
# repository's own CI job. This job calls it directly and never runs
# sync-from-repo.sh -- that script, and the rest of deploy/, belong to the
# Cayenne repository, and only its job updates them.
# The image is always built and pushed, :latest included, on a merge to
# master, because cut-over needs it to exist. The tailnet and deploy steps
# need a VM; until CAYENNE_VM_HOST is set they are skipped, and the skip is
# written to the step summary rather than passing quietly.
on:
  push:
    branches: [master]
  pull_request:

jobs:
  deploy:
    runs-on: ubuntu-latest
    # One deploy at a time. Cayenne's own job cannot join this group (it is a
    # different repository's workflow), so deploy.sh also takes a lock on the
    # VM to serialise across both.
    concurrency:
      group: recipeparser-deploy
      cancel-in-progress: false
    # packages: write is exercised only on a push (the ghcr login and push
    # steps below); a pull-request run never reaches either.
    permissions:
      contents: read
      packages: write

    env:
      CAYENNE_VM_HOST: ${{ vars.CAYENNE_VM_HOST }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Log in to ghcr
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Docker refuses an uppercase repository name, and the owner is
      # IanDBallard, so every tag uses this lowercased copy.
      - name: Lowercase the image owner
        id: owner
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      # On a pull request this builds and does not push, so a broken
      # Dockerfile fails before the merge rather than during a deploy.
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          tags: |
            ghcr.io/${{ steps.owner.outputs.owner }}/ingestion-api:${{ github.sha }}
            ghcr.io/${{ steps.owner.outputs.owner }}/ingestion-api:latest

      - name: Note why the deploy was skipped
        if: github.event_name == 'push' && env.CAYENNE_VM_HOST == ''
        run: |
          echo "CAYENNE_VM_HOST is not configured, so the image was pushed but the deploy was skipped."
          echo "**Deploy skipped:** \`CAYENNE_VM_HOST\` is not configured. The image was pushed; nothing was deployed. See deploy/README.md in the Cayenne repository." >> "$GITHUB_STEP_SUMMARY"

      - name: Join the tailnet
        if: github.event_name == 'push' && env.CAYENNE_VM_HOST != ''
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      # deploy.sh verifies api through /health -- there is no version.txt
      # build arg for this image, unlike web.
      - name: Deploy
        if: github.event_name == 'push' && env.CAYENNE_VM_HOST != ''
        run: |
          tailscale ssh "$CAYENNE_VM_HOST" \
            "sudo bash -c 'set -a; . /opt/cayenne/site.env; set +a; /opt/cayenne/deploy.sh --service api --sha ${{ github.sha }} --ci'"
