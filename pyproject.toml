[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "recipeparser"
version = "9.50.1"
description = "Extract recipes from EPUB cookbooks and export to Paprika 3"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Ian Ballard"}
]
dependencies = [
    "EbookLib>=0.18",
    "beautifulsoup4>=4.12.2",
    "lxml>=5.3.1",
    "pydantic>=2.11.9",
    "google-genai>=1.38.0",
    "python-dotenv>=1.1.1",
    "pyyaml>=6.0.1",
    "customtkinter>=5.2.2",
    "pymupdf>=1.24.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "httpx>=0.27.0",
    "PyJWT>=2.8.0",
    "python-multipart>=0.0.9",
    # Imported lazily by adapters/api.py and io/writers/image_store.py. It was
    # never declared, so the app booted fine on a fresh install and then failed
    # every job-row write and photo upload at call time, where the errors are
    # caught and logged. CI caught it because CI installs only what is declared.
    "supabase>=2.0",
    "Pillow>=11.0",
    # Parses the search agent's SQL for the statement gate (adapters/ai_search/sql_gate.py).
    # pglast 8 needs Python 3.10 or later.
    "pglast>=8.7,<9",
    # The ai_reader connection the search agent's SQL runs through (adapters/ai_search/ai_db.py).
    "psycopg[binary]>=3.2",
    "psycopg-pool>=3.2",
    # The search agent's Claude calls (adapters/ai_search/agent.py): task budgets and fallbacks need 2.8.
    "anthropic>=2.8.0,<3",
]

[project.scripts]
recipeparser = "recipeparser.__main__:main"
recipeparser-gui = "recipeparser.adapters.gui:run_gui"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    # The suite runs distributed by default (see addopts below).  This must be
    # declared, not merely installed on a developer's machine: without it the
    # -n in addopts is an "unrecognized arguments" hard failure, which is
    # exactly what CI would have hit -- it installs only what is declared.
    "pytest-xdist>=3.8",
    "syrupy>=4.0",
    "ruff>=0.4",
    "mypy>=1.10",
    # scripts/measure_similarity_tiers.py scores every pair of recipes (1.28M at 1,601);
    # a script, not the service, so it is a dev dependency only.
    "numpy>=2.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["recipeparser*"]

[tool.setuptools.package-data]
recipeparser = ["*.yaml"]

[tool.pytest.ini_options]
# live_*_test.py files are standalone scripts that require a running server.
# They are NOT pytest suites — exclude them from the standard test run.
# collect_ignore is handled in conftest.py (the correct location for this setting).
# scripts/ is a top-level directory the installed package does not cover, so the
# repository root has to be importable wherever pytest is invoked from.
pythonpath = ["."]
testpaths = ["tests"]
python_files = ["test_*.py"]
# Distributed by default.  "auto" is resolved by pytest_xdist_auto_num_workers
# in tests/conftest.py, NOT by xdist's own answer -- xdist counts logical cores
# (16 on the desktop this was tuned on) and that measured slower than serial.
# conftest caps the count and demotes write-mode runs back to serial; see
# default_workers and serial_reason there.
addopts = ["-n", "auto"]
markers = [
    "transient: marks tests as transient (deleted in Phase 8 alongside legacy code)",
    "ai_db: needs a local Supabase with the Stage 2 ai schema (AI_SEARCH_TEST_ADMIN_DSN)",
]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "TID"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"recipeparser.io".msg = "core/ modules cannot import from io/ — violates hexagonal architecture"
"recipeparser.adapters".msg = "core/ modules cannot import from adapters/ — violates hexagonal architecture"

[tool.ruff.lint.per-file-ignores]
# The layer ban is a rule about core/ (ARCHITECTURE.md, hexagonal layout): core/ may not
# import io/ or adapters/. Everything else -- io/, adapters/, the package-root entry points,
# scripts/ and tests/ -- is an outer layer that wires them together, so the ban is switched
# off everywhere except core/ rather than exempted file by file.
"!recipeparser/core/**" = ["TID251"]
"tests/unit/test_picture_gen.py" = ["E501"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = "recipeparser.core.fsm"
disallow_untyped_defs = true
disallow_any_generics = true
