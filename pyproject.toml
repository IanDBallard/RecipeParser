[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "recipeparser"
version = "8.0.0"
description = "Extract recipes from EPUB cookbooks and export to Paprika 3"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Ian Ballard"}
]
dependencies = [
    "EbookLib>=0.18",
    "beautifulsoup4>=4.12.2",
    "lxml>=5.3.1",
    "pydantic>=2.11.9",
    "google-genai>=1.38.0",
    "python-dotenv>=1.1.1",
    "pyyaml>=6.0.1",
    "customtkinter>=5.2.2",
    "pymupdf>=1.24.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "httpx>=0.27.0",
    "PyJWT>=2.8.0",
    "python-multipart>=0.0.9",
    # Imported lazily by adapters/api.py and io/writers/image_store.py. It was
    # never declared, so the app booted fine on a fresh install and then failed
    # every job-row write and photo upload at call time, where the errors are
    # caught and logged. CI caught it because CI installs only what is declared.
    "supabase>=2.0",
]

[project.scripts]
recipeparser = "recipeparser.__main__:main"
recipeparser-gui = "recipeparser.adapters.gui:run_gui"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    # The suite runs distributed by default (see addopts below).  This must be
    # declared, not merely installed on a developer's machine: without it the
    # -n in addopts is an "unrecognized arguments" hard failure, which is
    # exactly what CI would have hit -- it installs only what is declared.
    "pytest-xdist>=3.8",
    "syrupy>=4.0",
    "ruff>=0.4",
    "mypy>=1.10",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["recipeparser*"]

[tool.setuptools.package-data]
recipeparser = ["*.yaml"]

[tool.pytest.ini_options]
# live_*_test.py files are standalone scripts that require a running server.
# They are NOT pytest suites — exclude them from the standard test run.
# collect_ignore is handled in conftest.py (the correct location for this setting).
# scripts/ is a top-level directory the installed package does not cover, so the
# repository root has to be importable wherever pytest is invoked from.
pythonpath = ["."]
testpaths = ["tests"]
python_files = ["test_*.py"]
# Distributed by default.  "auto" is resolved by pytest_xdist_auto_num_workers
# in tests/conftest.py, NOT by xdist's own answer -- xdist counts logical cores
# (16 on the desktop this was tuned on) and that measured slower than serial.
# conftest caps the count and demotes write-mode runs back to serial; see
# default_workers and serial_reason there.
addopts = ["-n", "auto"]
markers = [
    "transient: marks tests as transient (deleted in Phase 8 alongside legacy code)",
]

[tool.ruff]
line-length = 120
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "TID"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"recipeparser.io".msg = "core/ modules cannot import from io/ — violates hexagonal architecture"
"recipeparser.adapters".msg = "core/ modules cannot import from adapters/ — violates hexagonal architecture"

[tool.ruff.lint.per-file-ignores]
"recipeparser/io/**" = ["TID"]
"recipeparser/adapters/**" = ["TID"]
# scripts/ are an outer shell, not core: a one-off repair exists precisely to
# wire a reader to a writer, which is the composition adapters/ is allowed too.
"scripts/**" = ["TID"]
# This test file drives recipeparser.adapters and recipeparser.io directly by design.
"tests/test_api.py" = ["TID"]
# Reader unit tests exercise recipeparser.io.readers directly by design.
"tests/unit/readers/test_readers.py" = ["TID"]
"tests/unit/readers/test_image_reader.py" = ["TID"]
"tests/unit/readers/test_pdf_ocr_fallback.py" = ["TID"]
"tests/unit/readers/test_page_meta.py" = ["TID"]
# Reader goldens exercise recipeparser.io.readers directly by design (spec §6.1).
"tests/goldens/test_readers_golden.py" = ["TID"]
# Stage goldens drive readers directly to build real chunks for the parse path (spec §6.2).
"tests/goldens/test_stages_golden.py" = ["TID"]
# E2E goldens drive RecipePipeline and both zip writers directly (spec §6.4).
"tests/goldens/test_e2e_golden.py" = ["TID"]

[tool.mypy]
python_version = "3.9"
strict = true
warn_return_any = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = "recipeparser.core.fsm"
disallow_untyped_defs = true
disallow_any_generics = true
