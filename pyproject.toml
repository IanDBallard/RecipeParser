[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "recipeparser"
version = "9.51.3"
description = "Extract recipes from EPUB cookbooks and export to Paprika 3"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Ian Ballard"}
]
dependencies = [
    "EbookLib>=0.18",
    "beautifulsoup4>=4.12.2",
    "lxml>=5.3.1",
    "pydantic>=2.11.9",
    "google-genai>=1.38.0",
    "python-dotenv>=1.1.1",
    "pyyaml>=6.0.1",
    "customtkinter>=5.2.2",
    "pymupdf>=1.24.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "httpx>=0.27.0",
    "PyJWT>=2.8.0",
    "python-multipart>=0.0.9",
    # Imported lazily by adapters/api.py and io/writers/image_store.py. It was
    # never declared, so the app booted fine on a fresh install and then failed
    # every job-row write and photo upload at call time, where the errors are
    # caught and logged. CI caught it because CI installs only what is declared.
    "supabase>=2.0",
    "Pillow>=11.0",
    # Parses the search agent's SQL for the statement gate (adapters/ai_search/sql_gate.py).
    # pglast 8 needs Python 3.10 or later.
    "pglast>=8.7,<9",
    # The ai_reader connection the search agent's SQL runs through (adapters/ai_search/ai_db.py).
    "psycopg[binary]>=3.2",
    "psycopg-pool>=3.2",
    # The search agent's Claude calls (adapters/ai_search/agent.py): task budgets and fallbacks need 2.8.
    "anthropic>=2.8.0,<3",
]

[project.scripts]
recipeparser = "recipeparser.__main__:main"
recipeparser-gui = "recipeparser.adapters.gui:run_gui"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    # The suite runs distributed by default (see addopts below).  This must be
    # declared, not merely installed on a developer's machine: without it the
    # -n in addopts is an "unrecognized arguments" hard failure, which is
    # exactly what CI would have hit -- it installs only what is declared.
    "pytest-xdist>=3.8",
    "syrupy>=4.0",
    "ruff>=0.4",
    "mypy>=1.10",
    # scripts/measure_similarity_tiers.py scores every pair of recipes (1.28M at 1,601);
    # a script, not the service, so it is a dev dependency only.
    "numpy>=2.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["recipeparser*"]

[tool.setuptools.package-data]
recipeparser = ["*.yaml"]

[tool.pytest.ini_options]
# live_*_test.py files are standalone scripts that require a running server.
# They are NOT pytest suites — exclude them from the standard test run.
# collect_ignore is handled in conftest.py (the correct location for this setting).
# scripts/ is a top-level directory the installed package does not cover, so the
# repository root has to be importable wherever pytest is invoked from.
pythonpath = ["."]
testpaths = ["tests"]
python_files = ["test_*.py"]
# Distributed by default.  "auto" is resolved by pytest_xdist_auto_num_workers
# in tests/conftest.py, NOT by xdist's own answer -- xdist counts logical cores
# (16 on the desktop this was tuned on) and that measured slower than serial.
# conftest caps the count and demotes write-mode runs back to serial; see
# default_workers and serial_reason there.
addopts = ["-n", "auto"]
markers = [
    "transient: marks tests as transient (deleted in Phase 8 alongside legacy code)",
    "ai_db: needs a local Supabase with the Stage 2 ai schema (AI_SEARCH_TEST_ADMIN_DSN)",
]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
# DTZ: no naive datetime (layers.one-clock, ARCHITECTURE.md "One clock").
select = ["E", "F", "I", "TID", "DTZ"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
# layers.model-sdk-owners (ARCHITECTURE.md "Model SDK owners"): only the modules listed under
# per-file-ignores below import a model SDK. recipeparser/core/ruff.toml repeats these two
# entries beside core's layer ban, because a nested config replaces this table.
"google.genai".msg = "Only the model SDK owners import google.genai (ARCHITECTURE.md, Model SDK owners)"
"anthropic".msg = "Only the model SDK owners import anthropic (ARCHITECTURE.md, Model SDK owners)"

[tool.ruff.lint.per-file-ignores]
# The model SDK owners (layers.model-sdk-owners). core/picture_gen.py is one too; it carries
# a line `noqa: TID251` instead, because a file ignore would also switch off core's layer ban.
"recipeparser/gemini.py" = ["TID251"]
"recipeparser/adapters/ai_search/**" = ["TID251"]
# Entry points that build a client from an API key, and the adapters that type or catch it.
"recipeparser/__init__.py" = ["TID251"]
"recipeparser/__main__.py" = ["TID251"]
"recipeparser/adapters/api.py" = ["TID251"]
"recipeparser/adapters/gui.py" = ["TID251"]
"recipeparser/adapters/search_api.py" = ["TID251"]
"recipeparser/adapters/shopping_api.py" = ["TID251"]
# Tests and scripts drive the SDKs directly and build naive datetimes on purpose.
"tests/**" = ["TID251", "DTZ"]
"scripts/**" = ["TID251", "DTZ"]
"tests/unit/test_picture_gen.py" = ["E501"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = "recipeparser.core.fsm"
disallow_untyped_defs = true
disallow_any_generics = true
